<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="'Noto Sans SC','Arimo','Liberation Sans',Arial,sans-serif"><defs><marker id="ah087F83" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087F83"/></marker><marker id="ahC45B25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C45B25"/></marker><marker id="ah17324D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker><marker id="ah52677B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52677B"/></marker><marker id="ah000000" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="660" fill="#fff"/><rect x="20" y="20" width="440" height="280" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">逐条证据声明核验</tspan></text><text x="34" y="75" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">只判断当前一条证据声明是否受当前这条原始记录支持。</tspan></text><text x="34" y="96.7" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">resource 是按 evidence.source_id 读取的原始记录。</tspan></text><text x="34" y="127.4" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">逐项核对 statement 中的药物名称、剂量、检验值、时间</tspan></text><text x="34" y="149.1" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">等事实。只有记录支持全部声明时 valid=true；矛盾或没</tspan></text><text x="34" y="170.79999999999998" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">有记载时 valid=false。</tspan></text><text x="34" y="201.49999999999997" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">不得用其他记录或临床常识替代当前引用。reason 写明</tspan></text><text x="34" y="223.19999999999996" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">source_id 和支持或冲突的具体事实。</tspan></text><line x1="240" y1="303" x2="240" y2="333" stroke="#000000" stroke-width="1" marker-end="url(#ah000000)"/><rect x="20" y="336" width="440" height="304" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="363" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">整题核验</tspan></text><text x="34" y="391" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">核验题目和参考答案是否受 evidence_records 中的原始</tspan></text><text x="34" y="412.7" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">数据支持。记录已从环境读取，证据声明已逐条核验。</tspan></text><text x="34" y="443.4" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">不要推定记录未提供的患者事实。决策点后的资料可支持参</tspan></text><text x="34" y="465.09999999999997" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">考答案，但后续真实治疗并非临床决策题唯一正确方案。</tspan></text><text x="34" y="495.79999999999995" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">题目含糊、证据不足或参考答案不正确时返回</tspan></text><text x="34" y="517.5" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">valid=false，并解释依据。</tspan></text><rect x="480" y="20" width="500" height="458" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="494" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">推理深度评价</tspan></text><text x="494" y="75" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">检查题干、证据和候选答案，按正确满足核心要求的最简充分解题路</tspan></text><text x="494" y="96.7" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">径评分；候选答案不自动正确，也不代表唯一解题路径。</tspan></text><text x="494" y="127.4" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">1分：事实检索。读取、匹配、计数、汇总或复述已记载的诊断；重</tspan></text><text x="494" y="149.1" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">复记录不自动升级。</tspan></text><text x="494" y="179.79999999999998" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">2分：简单判断。事实结合一条临床规则即可得出结论；多个独立简</tspan></text><text x="494" y="201.49999999999997" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">单判断不自动成为3分。</tspan></text><text x="494" y="232.19999999999996" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">3分：必要整合。结论依赖至少两个独立且不可替代的事实及其关系；</tspan></text><text x="494" y="253.89999999999995" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">删去关键事实后，结论改变或无法成立。</tspan></text><text x="494" y="284.59999999999997" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">4分：决策权衡。至少两个合理方案、相互冲突的收益风险或限制，</tspan></text><text x="494" y="306.29999999999995" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">以及决定取舍的患者证据。</tspan></text><text x="494" y="336.99999999999994" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">检查捷径：题干是否已给出结论、诊断标签是否含答案、单条记录能</tspan></text><text x="494" y="358.69999999999993" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">否回答、是否只需通用建议。证据多、跨度长、答案长本身不加分。</tspan></text><text x="494" y="389.3999999999999" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">reason 写明解题路径、必要事实及关系、捷径与层级依据；4分须</tspan></text><text x="494" y="411.0999999999999" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">说明方案与取舍。无法确认的病历事实不得补造。</tspan></text><rect x="480" y="502" width="500" height="138" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="494" y="529" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">评分聚合与高阶题判定</tspan></text><text x="494" y="557" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">GPT-4o-mini 与 GPT-5.4-nano 独立评分。两份有效评分取中位</tspan></text><text x="494" y="578.7" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">数并向下取整；缺任一份则不形成聚合层级。</tspan></text><text x="494" y="609.4000000000001" font-size="15.5" fill="#000000"><tspan font-weight="400" fill="#000000">通过核验且聚合层级不低于3的任务计为高阶题。</tspan></text></svg>
