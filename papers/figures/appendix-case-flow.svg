<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" width="1000" height="482" font-family="'Noto Sans SC','Arimo','Liberation Sans',Arial,sans-serif"><defs><marker id="ah087F83" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087F83"/></marker><marker id="ahC45B25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C45B25"/></marker><marker id="ah17324D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker><marker id="ah52677B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52677B"/></marker></defs><rect width="1000" height="482" fill="#fff"/><text x="500" y="26" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle"><tspan font-weight="700" fill="#17324D">案例：一次证据核验失败如何转化为生成指导修订</tspan></text><text x="500" y="44" font-size="10.5" font-weight="400" fill="#52677B" text-anchor="middle"><tspan font-weight="400" fill="#52677B">PhysicianBench 进化第 1 轮，任务 0001:1:1</tspan></text><rect x="20" y="62" width="213" height="232" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M20,100 v-26 a12,12 0 0 1 12,-12 h189 a12,12 0 0 1 12,12 v26 z" fill="#D5EEEE"/><rect x="32" y="71" width="22" height="20" rx="10" fill="#087F83" stroke="#087F83" stroke-width="0"/><text x="43" y="85.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">1</tspan></text><text x="64" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">生成任务</tspan></text><text x="34" y="122" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">题目</tspan></text><text x="34" y="138" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">考虑患者在 2024 年 1 月 5 日和</tspan></text><text x="34" y="153.95" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">1 月 21 日的实验室结果，评估其血</tspan></text><text x="34" y="169.89999999999998" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">糖和血脂水平的变化及对健康管理的</tspan></text><text x="34" y="185.84999999999997" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">影响。</tspan></text><text x="34" y="209.79999999999995" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">候选参考答案</tspan></text><rect x="30" y="213.79999999999995" width="193" height="64" rx="6" fill="#FDECEA" stroke="#F2C7C3" stroke-width="1.2"/><text x="36" y="227.79999999999995" font-size="11" fill="#B3261E"><tspan font-weight="400" fill="#B3261E">1 月 21 日的记录中未见进一步的</tspan></text><text x="36" y="243.74999999999994" font-size="11" fill="#B3261E"><tspan font-weight="400" fill="#B3261E">血糖异常记录，说明在一定程度上患</tspan></text><text x="36" y="259.69999999999993" font-size="11" fill="#B3261E"><tspan font-weight="400" fill="#B3261E">者的血糖得到控制。</tspan></text><rect x="269" y="62" width="213" height="232" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M269,100 v-26 a12,12 0 0 1 12,-12 h189 a12,12 0 0 1 12,12 v26 z" fill="#D5EEEE"/><rect x="281" y="71" width="22" height="20" rx="10" fill="#087F83" stroke="#087F83" stroke-width="0"/><text x="292" y="85.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">2</tspan></text><text x="313" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">证据核验</tspan></text><text x="283" y="122" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">任务声明</tspan></text><rect x="283" y="126" width="100.8" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="290" y="139" font-size="10" fill="#17324D" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-weight="500">Condition/2402</text><text x="283" y="162" font-size="11" fill="#B3261E"><tspan font-weight="400" fill="#B3261E">声明该条件为「高血糖」</tspan></text><text x="283" y="185.95" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">原始记录</tspan></text><text x="283" y="201.95" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">高脂血症（ICD-10-CM E78.5）</tspan></text><rect x="279" y="225.89999999999998" width="193" height="40" rx="8" fill="#FDECEA" stroke="#F2C7C3" stroke-width="1.2"/><text x="289" y="243.89999999999998" font-size="12" font-weight="700" fill="#B3261E" text-anchor="start"><tspan font-weight="700" fill="#B3261E">✗  核验未通过</tspan></text><text x="289" y="259.9" font-size="10" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" fill="#B3261E">valid=false</text><rect x="518" y="62" width="213" height="232" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M518,100 v-26 a12,12 0 0 1 12,-12 h189 a12,12 0 0 1 12,12 v26 z" fill="#F8E8DC"/><rect x="530" y="71" width="22" height="20" rx="10" fill="#C45B25" stroke="#C45B25" stroke-width="0"/><text x="541" y="85.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">3</tspan></text><text x="562" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">轮末反馈</tspan></text><text x="532" y="122" font-size="10.5" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">反馈结论</tspan></text><text x="532" y="138" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">缺失血糖复查结果，不能支持「血糖</tspan></text><text x="532" y="153.95" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">得到控制」。</tspan></text><text x="532" y="179.89999999999998" font-size="10.5" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">问题归类</tspan></text><rect x="532" y="193.89999999999998" width="56" height="19" rx="9.5" fill="#FFF5ED" stroke="#F8E8DC" stroke-width="1"/><text x="539" y="207.075" font-size="10.5" fill="#C45B25" font-weight="500">证据不足</text><rect x="767" y="62" width="213" height="232" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M767,100 v-26 a12,12 0 0 1 12,-12 h189 a12,12 0 0 1 12,12 v26 z" fill="#F8E8DC"/><rect x="779" y="71" width="22" height="20" rx="10" fill="#C45B25" stroke="#C45B25" stroke-width="0"/><text x="790" y="85.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">4</tspan></text><text x="811" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">策略更新</tspan></text><text x="781" y="122" font-size="10.5" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">更新内容</tspan></text><circle cx="784" cy="134.26" r="1.9" fill="#087F83"/><text x="792" y="138" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">修订生成指导 g<tspan font-size="70%" dy="3">r</tspan><tspan dy="-3"></tspan> → g<tspan font-size="70%" dy="3">r+1</tspan><tspan dy="-3"></tspan></tspan></text><circle cx="784" cy="153.20999999999998" r="1.9" fill="#087F83"/><text x="792" y="156.95" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">检查与风险分层方向同步加限定</tspan></text><circle cx="784" cy="172.15999999999997" r="1.9" fill="#087F83"/><text x="792" y="175.89999999999998" font-size="11" fill="#17324D"><tspan font-weight="400" fill="#17324D">方向权重保持不变</tspan></text><rect x="777" y="197.84999999999997" width="193" height="40" rx="8" fill="#FFF5ED" stroke="#F8E8DC" stroke-width="1.2"/><text x="787" y="215.84999999999997" font-size="12" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">θ<tspan font-size="70%" dy="3">r</tspan><tspan dy="-3"></tspan> → θ<tspan font-size="70%" dy="3">r+1</tspan><tspan dy="-3"></tspan></tspan></text><text x="787" y="231.84999999999997" font-size="10" font-weight="400" fill="#52677B" text-anchor="start"><tspan font-weight="400" fill="#52677B">各方向权重仍为 1</tspan></text><line x1="236" y1="178" x2="266" y2="178" stroke="#17324D" stroke-width="1.8" marker-end="url(#ah17324D)"/><line x1="485" y1="178" x2="515" y2="178" stroke="#C45B25" stroke-width="1.8" marker-end="url(#ahC45B25)"/><line x1="734" y1="178" x2="764" y2="178" stroke="#C45B25" stroke-width="1.8" marker-end="url(#ahC45B25)"/><text x="251" y="166" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="middle"><tspan font-weight="400" fill="#52677B">核验</tspan></text><text x="500" y="166" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="middle"><tspan font-weight="400" fill="#52677B">汇总</tspan></text><text x="749" y="166" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="middle"><tspan font-weight="400" fill="#52677B">更新</tspan></text><line x1="873.5" y1="296" x2="873.5" y2="327" stroke="#C45B25" stroke-width="1.8" marker-end="url(#ahC45B25)"/><rect x="20" y="330" width="960" height="124" rx="12" fill="#FFF5ED" stroke="#F8E8DC" stroke-width="1.2"/><text x="36" y="354" font-size="13" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">更新后的生成指导 g<tspan font-size="70%" dy="3">r+1</tspan><tspan dy="-3"></tspan>（新增段落）</tspan></text><rect x="36" y="368" width="928" height="34" rx="8" fill="#FFFFFF" stroke="#F8E8DC" stroke-width="1.2"/><rect x="36" y="368" width="5" height="34" rx="2.5" fill="#C45B25"/><text x="54" y="390" font-size="12" fill="#17324D"><tspan font-weight="400" fill="#17324D">纵向变化任务先确认可比数据：同一指标、同一单位、相近检测条件、明确基线与随访时间；缺失随访结果时不得推断「得到控制」「病情改善」或「恶化」。</tspan></text><rect x="36" y="416" width="87.5" height="20" rx="10" fill="#C45B25" stroke="#C45B25" stroke-width="1"/><text x="43" y="429.675" font-size="10.5" fill="#FFFFFF" font-weight="500">检查与风险分层</text><text x="133.5" y="430" font-size="11" font-weight="400" fill="#17324D" text-anchor="start"><tspan font-weight="400" fill="#17324D">仅在基线与随访数据可比时整合，证据缺失时限定结论</tspan></text><rect x="640" y="416" width="56" height="20" rx="10" fill="#C45B25" stroke="#C45B25" stroke-width="1"/><text x="647" y="429.675" font-size="10.5" fill="#FFFFFF" font-weight="500">方向权重</text><text x="706" y="430" font-size="11" font-weight="400" fill="#17324D" text-anchor="start"><tspan font-weight="400" fill="#17324D">本轮各方向仍为 1</tspan></text><text x="980" y="474" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="end"><tspan font-weight="400" fill="#52677B">红色标注：被核验或反馈指出的问题内容</tspan></text></svg>
