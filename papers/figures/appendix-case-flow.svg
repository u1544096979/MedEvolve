<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 482" width="1000" height="482" font-family="'Noto Sans SC','Arimo','Liberation Sans',Arial,sans-serif"><defs><marker id="ah087F83" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087F83"/></marker><marker id="ahC45B25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C45B25"/></marker><marker id="ah17324D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker><marker id="ah52677B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52677B"/></marker><marker id="ah000000" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="482" fill="#fff"/><rect x="20" y="20" width="213" height="282" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">生成任务</tspan></text><text x="34" y="75" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">题目：考虑患者在2024年1月5</tspan></text><text x="34" y="93.9" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">日和1月21日的实验室结果，评</tspan></text><text x="34" y="112.80000000000001" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">估其血糖和血脂水平的变化，</tspan></text><text x="34" y="131.70000000000002" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">以及对健康管理的潜在影响。</tspan></text><text x="34" y="150.60000000000002" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">请使用观察和诊断资料支持评</tspan></text><text x="34" y="169.50000000000003" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">估。</tspan></text><text x="34" y="197.40000000000003" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">候选答案：1月21日的记录中未</tspan></text><text x="34" y="216.30000000000004" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">见进一步的血糖异常记录，说</tspan></text><text x="34" y="235.20000000000005" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">明在一定程度上患者的血糖得</tspan></text><text x="34" y="254.10000000000005" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">到控制。</tspan></text><rect x="269" y="20" width="213" height="282" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="283" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">证据核验</tspan></text><text x="283" y="75" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">任务声明：Condition/2402</tspan></text><text x="283" y="93.9" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">为“高血糖”。</tspan></text><text x="283" y="121.80000000000001" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">原始记录：高脂血症（</tspan></text><text x="283" y="140.70000000000002" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">ICD-10-CM E78.5）。</tspan></text><text x="283" y="168.60000000000002" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">核验结果：未通过。原始记录</tspan></text><text x="283" y="187.50000000000003" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">不支持该证据声明。</tspan></text><rect x="518" y="20" width="213" height="282" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="532" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">轮末反馈</tspan></text><text x="532" y="75" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">缺失血糖复查结果，不能支持</tspan></text><text x="532" y="93.9" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">“血糖得到控制”。</tspan></text><rect x="767" y="20" width="213" height="282" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="781" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">策略更新</tspan></text><text x="781" y="75" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">检查与风险分层方向：仅在基</tspan></text><text x="781" y="93.9" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">线与随访数据可比时进行整合，</tspan></text><text x="781" y="112.80000000000001" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">证据缺失时限定结论。</tspan></text><text x="781" y="140.70000000000002" font-size="13.5" fill="#000000"><tspan font-weight="400" fill="#000000">本轮各方向权重仍为1。</tspan></text><line x1="236" y1="161" x2="266" y2="161" stroke="#000000" stroke-width="1" marker-end="url(#ah000000)"/><line x1="485" y1="161" x2="515" y2="161" stroke="#000000" stroke-width="1" marker-end="url(#ah000000)"/><line x1="734" y1="161" x2="764" y2="161" stroke="#000000" stroke-width="1" marker-end="url(#ah000000)"/><line x1="873.5" y1="304" x2="873.5" y2="335" stroke="#000000" stroke-width="1" marker-end="url(#ah000000)"/><rect x="20" y="338" width="960" height="124" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="365" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">更新后的生成指导</tspan></text><text x="34" y="393" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">纵向变化任务先确认可比数据：同一指标、同一单位、相近检测条件、明确基线与随访时间；缺失随访结果时不得推断“得到控制”</tspan></text><text x="34" y="415.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">“病情改善”或“恶化”。</tspan></text></svg>
