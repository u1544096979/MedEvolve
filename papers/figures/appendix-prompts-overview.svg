<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" font-family="'Noto Sans SC','Arimo','Liberation Sans',Arial,sans-serif"><defs><marker id="ah087F83" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087F83"/></marker><marker id="ahC45B25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C45B25"/></marker><marker id="ah17324D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker><marker id="ah52677B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52677B"/></marker><marker id="ah000000" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs><rect width="1000" height="764" fill="#fff"/><rect x="20" y="20" width="300" height="350" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">数据探索</tspan></text><text x="34" y="75" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">你是医疗任务数据探索 Agent。</tspan></text><text x="34" y="106.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">压缩摘要不是原始证据，标记为截断时</tspan></text><text x="34" y="128.8" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">只覆盖部分记录，不能据摘要遗漏判断</tspan></text><text x="34" y="151.20000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">事实不存在。</tspan></text><text x="34" y="182.60000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">归纳数据的组织方式、时间变化、病程</tspan></text><text x="34" y="205.00000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">关联、证据引用方式和可支持的出题机</tspan></text><text x="34" y="227.40000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">会。</tspan></text><text x="34" y="258.80000000000007" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">输出 DataExploration：guidance</tspan></text><text x="34" y="281.20000000000005" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">是不绑定具体患者的抽象数据指导。不</tspan></text><text x="34" y="303.6" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">要复述患者 ID、具体事实或来源 ID；</tspan></text><text x="34" y="326" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">不要补充缓存未提供的事实。</tspan></text><rect x="20" y="394" width="300" height="350" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="34" y="421" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">环境探索</tspan></text><text x="34" y="449" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">你是医疗任务环境探索 Agent。</tspan></text><text x="34" y="480.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">通过原生工具了解查询名称、参数、返</tspan></text><text x="34" y="502.79999999999995" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">回结构及操作约束。仅访问开放的患者</tspan></text><text x="34" y="525.1999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">范围；只查询，不写入或模拟提交。</tspan></text><text x="34" y="556.5999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">交付前必须实际调用工具，不能仅凭函</tspan></text><text x="34" y="578.9999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">数清单认定能力已验证。区分已验证、</tspan></text><text x="34" y="601.3999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">调用失败与未验证能力。</tspan></text><text x="34" y="632.7999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">不要将具体患者观察或患者 ID 沉淀</tspan></text><text x="34" y="655.1999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">为公共指导；不要把工具或环境故障归</tspan></text><text x="34" y="677.5999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">纳为任务难度，或声称未验证能力已可</tspan></text><text x="34" y="699.9999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">用。</tspan></text><rect x="350" y="20" width="300" height="724" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="364" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">任务生成</tspan></text><text x="364" y="75" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">你是医疗任务生成角色。</tspan></text><text x="364" y="106.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">输入为患者缓存轨迹、固定的数据与环</tspan></text><text x="364" y="128.8" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">境探索指导、当前策略及两个生成方向。</tspan></text><text x="364" y="151.20000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">按两个位置的题型和难度各尝试生成一</tspan></text><text x="364" y="173.60000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">道任务。</tspan></text><text x="364" y="205.00000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">一次输出 TaskBatch，questions</tspan></text><text x="364" y="227.40000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">最多两题；证据不足时允许少出题或空</tspan></text><text x="364" y="249.80000000000004" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">列表，不能补造。没有查询工具，仅使</tspan></text><text x="364" y="272.20000000000005" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">用传入轨迹的事实和来源 ID。</tspan></text><text x="364" y="303.6" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">先从 trajectory.sources 的原始</tspan></text><text x="364" y="326" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">记录选择事实，再构造题目、答案和证</tspan></text><text x="364" y="348.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">据。</tspan></text><text x="364" y="379.79999999999995" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">evidence 每条 statement 只陈述</tspan></text><text x="364" y="402.19999999999993" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">该 source_id 实际支持的事实；跨</tspan></text><text x="364" y="424.5999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">记录结论分别引用各条依据。比较关系</tspan></text><text x="364" y="446.9999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">放在 reference_answer 中，</tspan></text><text x="364" y="469.39999999999986" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">evidence 分别陈述原始事实。</tspan></text><text x="364" y="500.79999999999984" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">不能把轨迹未出现某项事实推断为该事</tspan></text><text x="364" y="523.1999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">实不存在、检查未做或结果正常；证据</tspan></text><text x="364" y="545.5999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">不足时跳过该题位。</tspan></text><text x="364" y="576.9999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">真实后续治疗不是临床决策题的唯一答</tspan></text><text x="364" y="599.3999999999997" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">案，允许有依据的合理等价方案。</tspan></text><rect x="680" y="20" width="300" height="350" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="694" y="47" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">反馈分析</tspan></text><text x="694" y="75" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">你是医疗任务出题策略的反馈分析角色。</tspan></text><text x="694" y="106.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">区分质量问题、临床难度、证据不足、</tspan></text><text x="694" y="128.8" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">题意歧义及工具、环境、模型运行故障。</tspan></text><text x="694" y="160.20000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">工具、环境、模型故障及预算耗尽不能</tspan></text><text x="694" y="182.60000000000002" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">解释为难度提升；没有可靠完成评价时，</tspan></text><text x="694" y="205.00000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">明确结论受限，不能推断任务更难或解</tspan></text><text x="694" y="227.40000000000003" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">题失败。</tspan></text><text x="694" y="258.80000000000007" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">针对选题、证据组织、参考答案表述及</tspan></text><text x="694" y="281.20000000000005" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">生成方向，建议如何调整生成过程。</tspan></text><rect x="680" y="394" width="300" height="350" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="694" y="421" font-size="18" font-weight="700" fill="#000000" text-anchor="start"><tspan font-weight="700" fill="#000000">策略更新</tspan></text><text x="694" y="449" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">只根据当前 Strategy 与 Feedback</tspan></text><text x="694" y="471.4" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">输出新的 Strategy。</tspan></text><text x="694" y="502.79999999999995" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">更新 generation_guidance 和</tspan></text><text x="694" y="525.1999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">allocation，探索指导保持固定。经</tspan></text><text x="694" y="547.5999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">验须有证据支持、不绑定患者，并保留</tspan></text><text x="694" y="569.9999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">适用条件。</tspan></text><text x="694" y="601.3999999999999" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">个别题目的要求不自动成为通用规则。</tspan></text><text x="694" y="623.7999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">配比只安排两个生成位置，不改变数量。</tspan></text><text x="694" y="655.1999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">反馈证据不足时保留相应策略，不通过</tspan></text><text x="694" y="677.5999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">复杂题意、缺失数据或工具故障制造难</tspan></text><text x="694" y="699.9999999999998" font-size="16" fill="#000000"><tspan font-weight="400" fill="#000000">度。</tspan></text></svg>
