<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="'Noto Sans SC','Arimo','Liberation Sans',Arial,sans-serif"><defs><marker id="ah087F83" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087F83"/></marker><marker id="ahC45B25" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C45B25"/></marker><marker id="ah17324D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker><marker id="ah52677B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52677B"/></marker></defs><rect width="1000" height="610" fill="#fff"/><text x="500" y="26" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle"><tspan font-weight="700" fill="#17324D">证据核验与推理深度评价提示词</tspan></text><text x="500" y="44" font-size="10.5" font-weight="400" fill="#52677B" text-anchor="middle"><tspan font-weight="400" fill="#52677B">左：两阶段证据核验　右：推理深度 1–4 级与高阶题判定</tspan></text><rect x="20" y="62" width="440" height="530" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M20,100 v-26 a12,12 0 0 1 12,-12 h416 a12,12 0 0 1 12,12 v26 z" fill="#D5EEEE"/><text x="36" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">证据核验</tspan></text><text x="446" y="86" font-size="10" font-weight="400" fill="#52677B" text-anchor="end"><tspan font-weight="400" fill="#52677B">先逐条，后整题</tspan></text><rect x="36" y="122" width="24" height="24" rx="12" fill="#087F83" stroke="#087F83" stroke-width="0"/><text x="48" y="138.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">1</tspan></text><text x="70" y="139" font-size="13" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">逐条证据声明核验</tspan></text><text x="36" y="162" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">输入</tspan></text><rect x="66" y="148.5" width="131.18" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="73" y="161.675" font-size="10.5" fill="#17324D" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-weight="500">evidence.statement</text><rect x="202.18" y="148.5" width="108.91999999999999" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="209.18" y="161.675" font-size="10.5" fill="#17324D" font-weight="500">原始记录 resource</text><circle cx="39" cy="180.09" r="1.9" fill="#087F83"/><text x="47.5" y="184" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">只判断当前一条声明是否受当前这条原始记录支持</tspan></text><circle cx="39" cy="202.34" r="1.9" fill="#087F83"/><text x="47.5" y="206.25" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">逐项核对药物名称、剂量、检验值、时间等事实</tspan></text><circle cx="39" cy="224.59" r="1.9" fill="#087F83"/><text x="47.5" y="228.5" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">不得用其他记录或临床常识替代当前引用</tspan></text><circle cx="39" cy="246.84" r="1.9" fill="#087F83"/><text x="47.5" y="250.75" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">矛盾或没有记载时 valid=false</tspan></text><rect x="36" y="275" width="408" height="26" rx="7" fill="#EFF7F8" stroke="#D5EEEE" stroke-width="1.2"/><text x="46" y="292" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">输出</tspan></text><text x="78" y="292" font-size="10.5" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" fill="#17324D" font-weight="500">valid, reason（含 source_id 与具体事实）</text><line x1="240" y1="313" x2="240" y2="347" stroke="#17324D" stroke-width="1.8" marker-end="url(#ah17324D)"/><text x="250" y="335" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="start"><tspan font-weight="400" fill="#52677B">全部声明通过后</tspan></text><rect x="36" y="361" width="24" height="24" rx="12" fill="#087F83" stroke="#087F83" stroke-width="0"/><text x="48" y="377.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">2</tspan></text><text x="70" y="378" font-size="13" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">整题核验</tspan></text><text x="36" y="401" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">输入</tspan></text><rect x="66" y="387.5" width="35" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="73" y="400.675" font-size="10.5" fill="#17324D" font-weight="500">题目</text><rect x="106" y="387.5" width="56" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="113" y="400.675" font-size="10.5" fill="#17324D" font-weight="500">参考答案</text><rect x="167" y="387.5" width="118.16" height="19" rx="9.5" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1"/><text x="174" y="400.675" font-size="10.5" fill="#17324D" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" font-weight="500">evidence_records</text><circle cx="39" cy="419.09" r="1.9" fill="#087F83"/><text x="47.5" y="423" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">核验题目与参考答案是否受原始数据支持，证据声明已逐条核验</tspan></text><circle cx="39" cy="441.34" r="1.9" fill="#087F83"/><text x="47.5" y="445.25" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">不推定记录未提供的患者事实</tspan></text><circle cx="39" cy="463.59" r="1.9" fill="#087F83"/><text x="47.5" y="467.5" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">决策点后的资料可支持答案；后续真实治疗不是唯一正确方案</tspan></text><circle cx="39" cy="485.84" r="1.9" fill="#087F83"/><text x="47.5" y="489.75" font-size="11.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">题目含糊、证据不足或答案不正确时 valid=false</tspan></text><rect x="36" y="514" width="408" height="26" rx="7" fill="#EFF7F8" stroke="#D5EEEE" stroke-width="1.2"/><text x="46" y="531" font-size="10.5" font-weight="700" fill="#087F83" text-anchor="start"><tspan font-weight="700" fill="#087F83">输出</tspan></text><text x="78" y="531" font-size="10.5" font-family="'Roboto Mono','DejaVu Sans Mono',monospace" fill="#17324D" font-weight="500">valid, reason</text><rect x="480" y="62" width="500" height="530" rx="12" fill="#FFFFFF" stroke="#CEDCE5" stroke-width="1.2"/><path d="M480,100 v-26 a12,12 0 0 1 12,-12 h476 a12,12 0 0 1 12,12 v26 z" fill="#F8E8DC"/><text x="496" y="86" font-size="14" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">推理深度评价</tspan></text><text x="966" y="86" font-size="10" font-weight="400" fill="#52677B" text-anchor="end"><tspan font-weight="400" fill="#52677B">按最简充分解题路径评分</tspan></text><rect x="496" y="114" width="468" height="70" rx="8" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1.2"/><rect x="504" y="122" width="26" height="26" rx="13" fill="#52677B" stroke="none" stroke-width="0"/><text x="517" y="140" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">1</tspan></text><text x="540" y="138" font-size="12.5" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">事实检索</tspan></text><text x="540" y="155" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">读取、匹配、计数、汇总记录，或复述已明确记载的诊断。重复诊断不自动升级。</tspan></text><rect x="514" y="192" width="450" height="70" rx="8" fill="#F5F7F9" stroke="#D0D8E0" stroke-width="1.2"/><rect x="522" y="200" width="26" height="26" rx="13" fill="#52677B" stroke="none" stroke-width="0"/><text x="535" y="218" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">2</tspan></text><text x="558" y="216" font-size="12.5" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">简单判断</tspan></text><text x="558" y="233" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">事实结合一条临床规则即可得出结论；并列多个独立简单判断不自动成为 3 分。</tspan></text><rect x="532" y="270" width="432" height="70" rx="8" fill="#FFF5ED" stroke="#F8E8DC" stroke-width="1.2"/><rect x="540" y="278" width="26" height="26" rx="13" fill="#C45B25" stroke="none" stroke-width="0"/><text x="553" y="296" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">3</tspan></text><text x="576" y="294" font-size="12.5" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">必要整合</tspan></text><rect x="910" y="278" width="34" height="18" rx="9" fill="#C45B25" stroke="#C45B25" stroke-width="1"/><text x="917" y="290.5" font-size="10" fill="#FFFFFF" font-weight="500">高阶</text><text x="576" y="311" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">结论依赖多个独立事实间的关系：时间比较、竞争解释比较或条件推导；删去任</tspan></text><text x="576" y="325.49" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">一关键事实结论即变。</tspan></text><rect x="550" y="348" width="414" height="70" rx="8" fill="#FFF5ED" stroke="#F8E8DC" stroke-width="1.2"/><rect x="558" y="356" width="26" height="26" rx="13" fill="#C45B25" stroke="none" stroke-width="0"/><text x="571" y="374" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700" fill="#FFFFFF">4</tspan></text><text x="594" y="372" font-size="12.5" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">决策权衡</tspan></text><rect x="910" y="356" width="34" height="18" rx="9" fill="#C45B25" stroke="#C45B25" stroke-width="1"/><text x="917" y="368.5" font-size="10" fill="#FFFFFF" font-weight="500">高阶</text><text x="594" y="389" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">在多个合理方案间做患者特异的选择：至少两个备选、冲突的收益风险，以及</tspan></text><text x="594" y="403.49" font-size="10.5" fill="#17324D"><tspan font-weight="400" fill="#17324D">决定取舍的患者证据。</tspan></text><rect x="496" y="428" width="468" height="50" rx="8" fill="#FDECEA" stroke="#F2C7C3" stroke-width="1.2"/><text x="506" y="444" font-size="11" font-weight="700" fill="#B3261E" text-anchor="start"><tspan font-weight="700" fill="#B3261E">检查捷径</tspan></text><text x="566" y="444" font-size="10" fill="#17324D"><tspan font-weight="400" fill="#17324D">题干是否已给出结论？诊断标签是否直接含答案？单条记录能否回答？是否只需通用建</tspan></text><text x="566" y="457.8" font-size="10" fill="#17324D"><tspan font-weight="400" fill="#17324D">议？按仍需完成的实质推理评分；证据数量、跨度、答案长度不加分。</tspan></text><rect x="496" y="490" width="468" height="70" rx="8" fill="#EFF7F8" stroke="#D5EEEE" stroke-width="1.2"/><rect x="506" y="500" width="78.68000000000002" height="20" rx="10" fill="#FFFFFF" stroke="#D5EEEE" stroke-width="1"/><text x="513" y="513.675" font-size="10.5" fill="#17324D" font-weight="500">GPT-4o-mini</text><rect x="506" y="526" width="84.56000000000002" height="20" rx="10" fill="#FFFFFF" stroke="#D5EEEE" stroke-width="1"/><text x="513" y="539.675" font-size="10.5" fill="#17324D" font-weight="500">GPT-5.4-nano</text><line x1="606" y1="510" x2="646" y2="525" stroke="#087F83" stroke-width="1.8" marker-end="url(#ah087F83)"/><line x1="606" y1="536" x2="646" y2="525" stroke="#087F83" stroke-width="1.8" marker-end="url(#ah087F83)"/><text x="652" y="521" font-size="11" font-weight="700" fill="#066568" text-anchor="start"><tspan font-weight="700" fill="#066568">取中位数</tspan></text><text x="652" y="536" font-size="11" font-weight="700" fill="#066568" text-anchor="start"><tspan font-weight="700" fill="#066568">向下取整</tspan></text><line x1="718" y1="525" x2="748" y2="525" stroke="#087F83" stroke-width="1.8" marker-end="url(#ah087F83)"/><text x="754" y="521" font-size="11" font-weight="700" fill="#17324D" text-anchor="start"><tspan font-weight="700" fill="#17324D">聚合层级 l<tspan font-size="70%" dy="3">i</tspan><tspan dy="-3"></tspan> ≥ 3</tspan></text><text x="754" y="536" font-size="11" font-weight="700" fill="#C45B25" text-anchor="start"><tspan font-weight="700" fill="#C45B25">且通过核验 → 高阶题</tspan></text><text x="954" y="548" font-size="9.5" font-weight="400" fill="#52677B" text-anchor="end"><tspan font-weight="400" fill="#52677B">缺任一份有效评分则不形成聚合层级</tspan></text></svg>
